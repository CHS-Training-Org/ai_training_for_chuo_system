services:
  frontend:
    image: node:24-slim
    working_dir: /workspace/frontend
    volumes:
      - ..:/workspace:cached
      # node_modules を named volume に隔離する。
      # 理由: (1) 約2.5GB・数万ファイル規模で IDE の監視/検索対象として重い、
      # (2) pnpm はストアからハードリンクで配置するため、node_modules と
      #     pnpm-store を同一 FS（同一 named volume 群）に置く必要がある
      #     （frontend/pnpm-workspace.yaml の storeDir: /pnpm-store と対応）。
      - frontend-node-modules:/workspace/frontend/node_modules
      - pnpm-store:/pnpm-store
      # Claude Code の設定は .claude ディレクトリ（コンテナ専用 volume に隔離）と
      # ~/.claude.json（ホストと共有するバインド）に分かれる。下記の long-form / OS 非依存
      # 解決は ~/.claude.json バインドに対する注意書き:
      # devcontainer.json の mounts(短縮形)では Windows のドライブレター(C:)を含むパスが
      # 'C:\...:/root/...:rw' に変換され、Docker のボリューム parser が ':' で誤分割して
      # 「invalid volume specification」で起動失敗する。long-form は source/target を別キーに
      # 分けるため ':' の曖昧さがなく回避できる（VS Code 公式が compose 構成で推奨する方式）。
      # ホストのホームディレクトリを OS 非依存で解決する。WSL2/Linux/macOS では $HOME、
      # Windows ホストでは $USERPROFILE（${USERPROFILE:-$HOME} で前者優先・無ければ後者）。
      # devcontainer.json の initializeCommand が、マウント前にホスト側へ
      # .claude.json を事前生成している（同じパスに解決される必要がある）。
      # Claude Code の設定ディレクトリ(.claude)はホストと共有せず、コンテナ専用の
      # named volume に隔離する。
      # 理由: .claude 配下（plugins の known_marketplaces.json 等）にはプラグインの設置先や
      #   各種パスが絶対パスで書き込まれる。ホスト($HOME=/home/<user>)とコンテナ($HOME=/home/node)で
      #   base パスが食い違うため、ディレクトリを共有するとホストが書いたパスをコンテナが
      #   探しに行き、プラグインインストール等が「Source path does not exist」で失敗する
      #   （逆向きにホスト側を壊すシーソーも起きる）。
      #   ディレクトリごと隔離することで settings/memory/history/plugins/認証(.credentials.json)が
      #   ホストとコンテナで完全に独立する（frontend-node-modules の隔離と同じ手法）。
      #   ※ 認証情報(.credentials.json)も .claude 配下のため分離される。コンテナ側では
      #     初回に一度だけ /login が必要（以後はこの volume に保持され再ビルドでも維持される）。
      # コンテナの作業ユーザーを root から node に変えた際（Issue #166）、volume 名を
      # claude-config から claude-config-node に変えて作り直した。旧 volume には /root/.claude を
      # 指す絶対パスが書かれており、/home/node/.claude に付け替えると上記と同じ失敗が起きるため。
      - claude-config-node:/home/node/.claude
      # ~/.claude.json は .claude ディレクトリ外の単一ファイル。per-project 設定が絶対パスを
      # キーにするためホストと共有しても衝突せず（コンテナは /workspace、ホストは /home/<user>/...）、
      # アカウント識別・MCP 設定を引き継げるので共有を維持する。
      - type: bind
        source: ${USERPROFILE:-$HOME}/.claude.json
        target: /home/node/.claude.json
      # GitHub CLI（gh）の認証情報も claude-config-node と同じ理由でコンテナ専用の named volume に
      # 隔離する。初回に一度だけ `gh auth login` が必要（以後はこの volume に保持され
      # コンテナの再ビルドでも維持される）。volume 名を変えた理由は claude-config-node と同じ。
      - gh-config-node:/home/node/.config/gh
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # BE はこの dev コンテナ内で手動起動する（./gradlew bootRun または VS Code「Spring Boot: bookflow」）。
      # BACKEND_URL は .env.local の http://localhost:8080 を使用するため、ここでは上書きしない。
      # application.yml のデフォルト値は localhost:5432 だが、Compose ではサービスごとに
      # ネットワーク名前空間が分かれるため localhost では postgres / cognito-local に到達できない。
      # bootRun（JVM プロセス）はこのコンテナ内で動くため、サービス名で参照する必要がある。
      DB_URL: jdbc:postgresql://postgres:5432/bookflow
      DB_USERNAME: bookflow
      DB_PASSWORD: bookflow
      COGNITO_JWKS_URI: http://cognito-local:9229/local_user_pool_id/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
      cognito-local:
        condition: service_started
      volume-init:
        condition: service_completed_successfully
    # メインプロセスは root で動く（作業ユーザーの node とは別。devcontainer.json の remoteUser を参照）。
    # gh-config-node を /home/node/.config/gh にマウントすると、Docker が親の /home/node/.config を
    # root 所有で作るため、node が ~/.config 配下に書けなくなる。起動時に node へ戻しておく。
    # このディレクトリはこのコンテナ内にしか無いので、volume-init サービスからは直せない。
    command: sh -c "chown node:node /home/node/.config && exec sleep infinity"

  # named volume の所有者を、作業ユーザー（node。uid はホストのユーザーに合わせてある）に揃える
  # 使い捨てのサービス。frontend と docs はこの完了を待ってから起動する。
  # Docker は空の named volume を root 所有で作るため、node のままでは pnpm install や
  # Claude Code のログインが Permission denied になる。新規の volume も、root で動いていた頃に
  # 作られた既存の volume も、root 所有のものだけを直す（すでに揃っていれば何もしない）。
  # frontend 用の volume は、ホストのリポジトリ（/workspace）の所有者の uid/gid に揃える
  # （frontend の node は updateRemoteUserUID でホストの uid に合わせられるため）。
  # ファイル共有の方式によって /workspace が root 所有に見える環境では 1000:1000 にする。
  # docs-node-modules は、docs サービスが uid の更新されないイメージの node（1000）で動くため、常に 1000:1000。
  volume-init:
    image: node:24-slim
    user: root
    volumes:
      - ..:/workspace:ro
      - frontend-node-modules:/volumes/frontend-node-modules
      - pnpm-store:/volumes/pnpm-store
      - docs-node-modules:/volumes/docs-node-modules
      - claude-config-node:/volumes/claude-config-node
      - gh-config-node:/volumes/gh-config-node
    command:
      - sh
      - -c
      - |
        set -e
        fix() { find "$$1" ! -uid "$${2%:*}" -exec chown -h "$$2" {} +; }
        owner=$$(stat -c %u:%g /workspace)
        case "$$owner" in 0:*) owner=1000:1000 ;; esac
        for v in frontend-node-modules pnpm-store claude-config-node gh-config-node; do
          fix "/volumes/$$v" "$$owner"
        done
        fix /volumes/docs-node-modules 1000:1000

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bookflow
      POSTGRES_USER: bookflow
      POSTGRES_PASSWORD: bookflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookflow -d bookflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb
      DEFAULT_REGION: ap-northeast-1
    volumes:
      - localstack-data:/var/lib/localstack

  cognito-local:
    # バージョン固定: DB ファイル直接シード方式の互換性を維持するため digest で固定。
    # scripts/provision-cognito.sh はこのバージョンのファイルフォーマットを前提とする。
    image: jagregory/cognito-local@sha256:a5ad30d01da5016a38535a717f6e1642d1b37f886a7b17e90b67f6e5ad134831
    ports:
      - "9229:9229"
    volumes:
      - cognito-data:/app/.cognito

  docs:
    # ドキュメントサイト（Docusaurus）のローカルプレビュー。
    # Zensical 版の廃止（Issue #93）に伴い、uv/Python イメージから Node へ移した。
    image: node:24-slim
    # root のまま動かすと、ビルドの成果物（docs-next/build・docs-next/.docusaurus）がホスト側で
    # root 所有になる（Issue #166）。node:24-slim の node ユーザー（uid 1000）で動かす。
    # WSL2 の既定ユーザーの uid も 1000 なので一致する。
    user: node
    restart: on-failure
    depends_on:
      volume-init:
        condition: service_completed_successfully
    working_dir: /workspace/docs-next
    volumes:
      - ..:/workspace:cached
      # node_modules（生成物・多数のファイル）を named volume に隔離する。
      # 理由は frontend サービスの frontend-node-modules と同じで、bind mount 側の
      # ツリーから外して IDE のファイル監視・検索対象を減らすため。
      - docs-node-modules:/workspace/docs-next/node_modules
    ports:
      - "8000:8000"
    environment:
      # CI=true によるカラー抑制を上書きし、Claude Code 等の CLI ツールで色付き表示を維持する
      FORCE_COLOR: "1"
    # 初回起動時に依存をインストールしてから開発サーバーを起動する。
    # Docusaurus の開発サーバーは HMR を内蔵しているため、docs-next/docs 配下を
    # 編集するとブラウザが自動更新される。追加の監視プロセスは不要。
    #
    # --host 0.0.0.0 でコンテナ外へ公開し、--no-open でブラウザ起動を抑止する。
    command: sh -c "npm ci && exec npm run start -- --host 0.0.0.0 --port 8000 --no-open"

volumes:
  postgres-data:
  localstack-data:
  cognito-data:
  frontend-node-modules:
  pnpm-store:
  # docs（Docusaurus）の node_modules。詳細は docs サービスの volumes のコメントを参照。
  docs-node-modules:
  # Claude Code の設定ディレクトリ(.claude)をホストと分離するための専用ボリューム。
  # 詳細は frontend サービスの claude-config-node マウントのコメントを参照。
  claude-config-node:
  # GitHub CLI（gh）の認証情報を保持する専用ボリューム。詳細は frontend サービスの
  # gh-config-node マウントのコメントを参照。
  gh-config-node:
