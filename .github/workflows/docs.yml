name: Deploy Docusaurus docs-next to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-next/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docs-next/package-lock.json

      - name: Install dependencies
        working-directory: docs-next
        run: npm ci

      - name: Generate last_updated from git log
        working-directory: docs-next
        run: node scripts/gen-last-updated.mjs

      - name: Build Docusaurus
        working-directory: docs-next
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-next/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4