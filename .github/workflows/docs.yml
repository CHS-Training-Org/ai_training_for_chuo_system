name: Deploy Docs (Docusaurus) to GitHub Pages

# 配信方式は「gh-pages ブランチからの配信」（Settings > Pages > Deploy from a branch）。
# PR プレビュー（docs-preview.yml）が同じブランチの pr-preview/ 配下に成果物を置くため、
# Pages の公開方式を GitHub Actions からブランチ配信へ移した（ADR-031）。
# 公開 URL は変わらない。

on:
  push:
    branches: [main]
    paths:
      - 'docs-next/**'
      - 'ops-note/**'
      - '.github/actions/build-docs-site/**'
      - '.github/scripts/gen-legacy-redirects.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build docs site
        uses: ./.github/actions/build-docs-site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: pages-root
          branch: gh-pages
          # PR プレビューは同じブランチの pr-preview/ 配下に置かれる。
          # ここで除外しないと本番デプロイのたびに全プレビューが消える。
          clean-exclude: pr-preview/
