name: CI Scripts

# .github/scripts 配下のスクリプトのテスト。
# トークン消費量の集計はジョブログの出力様式に依存しており、パースが壊れても
# 集計値が伸びなくなるだけで気づきにくい。変更時に検知できるようにする。
#
# 必須 status check ではないため、他の CI と違い paths フィルタで絞ってよい
# （報告されない check が問題になるのは、必須指定された check に限られる）。

on:
  pull_request:
    branches:
      - main
      - 'learner/*/main'
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CI Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: スクリプトのテストを実行する
        run: node --test .github/scripts/lib/*.test.mjs
