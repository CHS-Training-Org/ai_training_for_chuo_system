name: CI Backend

# トリガー条件について（ADR-030 / Issue #92）
#
# branches: 学習者の PR の base は個人トランクブランチ（learner/<ユーザー名>/main）である。
#   main だけを対象にしていると、トランク宛 PR で CI がまったく起動しない。GitHub の
#   ブランチフィルタでは `*` が `/` にマッチしないため、'learner/*/main' は
#   learner/<ユーザー名>/main の形にのみ一致する。
#
# paths: 以前は paths フィルタで backend/** の変更時のみ起動していたが、これだと
#   frontend しか触らない PR では check がひとつも報告されない。報告されない check は
#   (a) ブランチ保護の必須 status check を永久に満たせず、(b) AI レビューの
#   「前提条件 CI green」（.github/workflows/references/pr-review-rubric/04-output-format.md）で
#   「1件も報告されていない」＝判定不能になり、総合判定が「完了」にならない。
#   そのため paths フィルタは使わず、ジョブは常に実行してステップ側で変更有無を判定する。
#   ジョブ自体を if: でスキップしないのは、スキップされた check の結論が success ではなく
#   skipped になり、上記 (b) の判定不能を再び踏むためである。

on:
  pull_request:
    branches:
      - main
      - 'learner/*/main'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # 変更検出で base との差分を取るため全履歴が要る（既定の fetch-depth: 1 では base.sha を持たない）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 対象変更の検出
        id: changes
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | grep -qE '^(backend/|\.github/workflows/ci-backend\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 対象変更なし（スキップ）
        if: steps.changes.outputs.run != 'true'
        run: echo "backend/ に変更がないため、以降のステップを実行せず success で終了する。"

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: backend/build.gradle.kts

      - name: Test
        if: steps.changes.outputs.run == 'true'
        run: ./gradlew test

      - name: Format check
        if: steps.changes.outputs.run == 'true'
        run: ./gradlew spotlessCheck

      - name: Checkstyle
        if: steps.changes.outputs.run == 'true'
        run: ./gradlew checkstyleMain
