name: Docs Check (docs-next)

# ドキュメントサイトのビルド検証を PR 時点で行う。
# デプロイ workflow（docs.yml）は main への push でしか走らないため、
# 壊れたリンク・アンカーがマージされてから初めて検知される状態だった。
# docusaurus.config.ts が onBrokenLinks / onBrokenAnchors を 'throw' にしているので、
# 破損があればこのジョブが落ちる。
#
# 検証はデプロイと同じ build-docs-site を通す。Docusaurus のビルドだけを回していた
# ころは、合成手順・リダイレクトスタブ生成の変更が PR で検証されなかった。

on:
  pull_request:
    paths:
      - 'docs-next/**'
      - '.github/actions/build-docs-site/**'
      - '.github/scripts/gen-legacy-redirects.mjs'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build docs site (壊れたリンク・アンカーがあれば失敗する)
        uses: ./.github/actions/build-docs-site
